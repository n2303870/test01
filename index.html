<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>점검중</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #0f0f0f, #1a1a1a);
      font-family: 'Arial', sans-serif;
      color: white;
      overflow: hidden;
    }

    .box {
      background: rgba(255, 255, 255, 0.08);
      padding: 40px 50px;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
      animation: fadeIn 0.5s ease-out;
    }

    .title {
      font-size: 32px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .msg {
      font-size: 18px;
      opacity: 0.85;
      line-height: 1.5em;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: scale(0.95);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="title">🚧 점검중입니다</div>
    <div class="msg">
      보다 나은 서비스를 위해<br>
      현재 서버 점검을 진행 중입니다.<br><br>
      잠시 후 다시 접속해주세요!
    </div>
  </div>
</body>
</html>
